<head>
<meta charset="utf-8">

<style>
:root{--paper:#fff9f7;--ink:#30292a;--wine:#95021d;--orange:#dc4c10;--line:#e9dad4;--muted:#80706e;--soft:#f6ede8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #d87447;outline-offset:4px}button{border:0}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.1}h1{font-size:49px;letter-spacing:-2px;color:var(--wine)}h2{font-size:31px;color:var(--wine)}h3{font-size:23px}p+p{margin-top:10px}.app{max-width:540px;margin:auto;padding:0 23px 35px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 19px;font-size:10px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--line)}.star{color:var(--wine);font-size:23px}.tagline{margin-top:14px;color:var(--muted);font-size:13px}.hero{padding:31px 0 26px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:1.9px;color:var(--muted);margin-bottom:12px}.section{margin:27px 0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.smalllink{background:none;color:var(--wine);padding:8px 0;font-size:12px}.feature{display:grid;grid-template-columns:112px 1fr;gap:19px;background:var(--soft);border-radius:5px 44px 5px 5px;padding:21px 17px}.cover{width:100%;display:block;aspect-ratio:2/3;object-fit:contain;background:var(--soft);border-radius:2px 16px 2px 2px;box-shadow:4px 7px 12px #5d332520}.feature .cover{align-self:start}.creator{font-size:11px;color:var(--muted);margin:9px 0 14px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 20px;border-radius:28px;background:linear-gradient(110deg,var(--wine),var(--orange));color:#fff;text-decoration:none;line-height:1.25}.btn.full{width:100%}.btn.outline{background:transparent;color:var(--wine);border:1px solid var(--wine)}.btn.light{background:var(--soft);color:var(--wine)}.feature .btn{font-size:13px;padding:11px 17px}.rubrics{display:grid;gap:9px}.rubric{display:flex;text-align:left;align-items:center;gap:13px;width:100%;border-radius:28px;min-height:49px;padding:12px 18px;color:#fff;background:linear-gradient(100deg,var(--wine),var(--orange));font-size:13px}.rubric .arrow{margin-left:auto}.rubric:nth-child(even){background:transparent;color:var(--wine);border:1px solid #bd878d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px 17px}.card{min-width:0}.card-open{display:block;width:100%;text-align:left;background:none;padding:0;color:inherit}.card .cover{max-height:245px}.card h3{font-size:21px;margin-top:12px}.card .creator{margin:7px 0 10px}.card .btn{width:100%;font-size:12px;padding:10px}.muted{color:var(--muted);font-size:13px}.notice{font-size:11px;color:var(--muted);padding:13px 0;border-top:1px solid var(--line);margin-top:23px}.panel{padding:21px;border:1px solid var(--line);border-radius:5px 30px 5px 5px}.panel.wine{background:var(--wine);color:white;border:0}.panel.wine h2,.panel.wine .muted{color:#fff0e8}.stats{display:flex;justify-content:space-between;margin:17px 0;gap:8px}.stat b{font:30px Georgia,serif;color:var(--wine);display:block}.stat span{font-size:11px;color:var(--muted)}.progress{height:6px;background:#e9d9d1;border-radius:10px;overflow:hidden;margin:13px 0}.progress i{display:block;background:linear-gradient(90deg,var(--wine),var(--orange));height:100%;transition:width .3s}.nav{position:sticky;top:0;width:min(100%,540px);margin:auto;background:var(--paper);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 9px;z-index:10}.nav button{background:none;color:var(--muted);padding:8px 3px;min-height:48px;font-size:12px}.nav button span{display:block;font-size:21px;line-height:1.3}.nav button.active{color:var(--wine)}.back{margin:20px 0;background:none;padding:6px 0;color:var(--wine)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid var(--line);background:none;border-radius:24px;padding:9px 13px;font-size:12px}.chip.active{background:var(--wine);color:white;border-color:var(--wine)}input,select,textarea{width:100%;border:1px solid #d7c7c0;background:#fffdfb;border-radius:12px;padding:13px;color:var(--ink);min-height:46px}textarea{resize:vertical;min-height:125px}label{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px}.search{margin:20px 0}.empty{text-align:center;padding:30px 17px;background:var(--soft);border-radius:20px}.empty h3{color:var(--wine);margin-bottom:12px}.book-head{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center;margin-bottom:25px}.book-head h1{font-size:32px;letter-spacing:-.7px}.divider{border-top:1px solid var(--line);margin:25px 0}.quote{font:20px/1.45 Georgia,serif;color:var(--wine);border-left:2px solid #d7866a;padding-left:16px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .btn{flex:1}.log{padding:14px 0;border-bottom:1px solid var(--line)}.log strong{font-weight:500}.log small{display:block;color:var(--muted)}.timer{font:52px Georgia,serif;text-align:center;color:var(--wine);padding:20px 0}.mono{font:75px Georgia,serif;color:var(--wine);background:var(--soft);border-radius:50% 50% 4px 4px;width:145px;height:180px;display:grid;place-items:center;margin:23px auto}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#39292b;color:white;border-radius:18px;padding:12px 18px;width:max-content;max-width:90%;z-index:30;font-size:13px;box-shadow:0 5px 20px #0002}.author-link{margin-top:21px;display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border-top:1px solid var(--line);padding:16px 0;color:var(--wine)}.loading{padding:80px 20px;text-align:center}.subheading{margin-bottom:13px}.badge{display:inline-block;font-size:10px;color:var(--wine);border:1px solid #dab8b4;border-radius:16px;padding:3px 9px;margin:8px 0}.history{margin-top:25px}@media(max-width:360px){.app{padding-left:16px;padding-right:16px}h1{font-size:42px}.feature{grid-template-columns:90px 1fr;gap:12px}.book-head{grid-template-columns:90px 1fr}.book-head h1{font-size:27px}}
.nav[hidden]{display:none}
.author-photo{display:block;width:min(100%,260px);height:380px;object-fit:cover;object-position:center 80%;border-radius:85px 85px 5px 5px;margin:0 auto 23px}.author-copy{margin:25px 0;white-space:pre-line;line-height:1.7}.author-copy p+p{margin-top:20px}
.completion{width:calc(100% - 40px);max-width:360px;border:0;border-radius:32px;padding:30px;background:var(--paper);color:var(--ink);text-align:center;box-shadow:0 20px 80px #38242840}.completion::backdrop{background:#30292a80}.completion h2{margin:12px 0}.completion p{margin:12px 0 22px}
.book-description,.source-quotes{white-space:pre-line;overflow-wrap:anywhere}.source-quotes{font:18px/1.65 Georgia,serif;color:var(--wine)}.book-gallery{display:grid;gap:14px;margin:20px 0}.book-gallery img{width:100%;height:auto;border-radius:8px}dialog.completion{max-height:85vh;overflow:auto}
</style>
</head>
<body>
<!--
ТЗ прототипа: каталог из data.json; 9 пересекающихся рубрик; обложка,
описание и цитаты; отложенные, читаю, прочитано; заметки;
план чтения на день, таймер, ручной учёт минут и страниц, история с комментарием.
Все данные экрана редактируются в data.json. Одна запись items может иметь
несколько categories. coverImage необязателен; без него рисуется демо-обложка.
author содержит предоставленные фото, текст и ссылку на группу.
Хранение прототипа: localStorage с отдельным ключом по Telegram user.id.
Это не серверная авторизация. Для выпуска: HTTPS, бот с Mini App URL,
серверная проверка initData, база персональных данных и синхронизация.
Реальные рекомендации, цитаты и обложки заменить перед публикацией.
Для автоматической загрузки оба файла разместить рядом на HTTP(S)-сервере.
Для локального просмотра доступен ручной импорт data.json с экрана ошибки.
-->
<nav class="nav" id="nav" aria-label="Основная навигация" hidden></nav>
<main class="app" id="app"><div class="loading"><span class="star">✦</span><p>Открываем книжную полку…</p></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog class="completion" id="completion" aria-labelledby="completion-title"><span class="star" aria-hidden="true">✦</span><h2 id="completion-title"></h2><p id="completion-text"></p><p class="muted" id="completion-book"></p><button class="btn full" id="completion-close"></button></dialog>
<script>
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();}
let data=null,view='home',selected=null,category=null,filter='saved',query='',storageOK=true;
const app=document.getElementById('app'),nav=document.getElementById('nav');
const storageKey='knizhnaya-polka-v1-'+(tg?.initDataUnsafe?.user?.id||'guest');
const blank=()=>({books:{},daily:{},sessions:[],timer:null});
let state=blank();
try{state=Object.assign(blank(),JSON.parse(localStorage.getItem(storageKey)||'null')||{});if(!state.books||!state.daily||!Array.isArray(state.sessions))state=blank();}catch(e){storageOK=false;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const item=id=>data.items.find(b=>b.id===id);
const bookState=id=>state.books[id]||{saved:false,status:'',note:'',position:0};
const bookTotal=b=>bookState(b.id).total||b.pages||b.durationMinutes||0;
function editBook(id){if(!state.books[id])state.books[id]={saved:false,status:'',note:'',position:0};return state.books[id];}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));return true;}catch(e){storageOK=false;toast('Сохранение на устройстве недоступно. Данные останутся до закрытия.');return false;}}
function toast(text){const el=document.getElementById('toast');el.innerHTML='<div class="toast">'+esc(text)+'</div>';clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.innerHTML='',3500);}
function cover(b){if(b.coverImage)return esc(b.coverImage);const svg='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="300" height="450" fill="'+b.coverColor+'"/><path d="M18 0v450" stroke="'+b.coverAccent+'" opacity=".5"/><circle cx="240" cy="355" r="112" fill="none" stroke="'+b.coverAccent+'" opacity=".4"/><circle cx="240" cy="355" r="83" fill="none" stroke="'+b.coverAccent+'" opacity=".4"/><text x="38" y="60" fill="'+b.coverAccent+'" font-family="Georgia" font-size="19">КНИЖНАЯ ПОЛКА</text><text x="38" y="240" fill="'+b.coverAccent+'" font-family="Georgia" font-size="100">'+b.coverMark+'</text><text x="38" y="410" fill="'+b.coverAccent+'" font-family="Arial" font-size="13">'+(b.type==='book'?'КНИГА':'ЛЕКЦИЯ')+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function image(b){return '<img class="cover" src="'+cover(b)+'" alt="Обложка: '+esc(b.title)+'">';}
function celebrate(id){const s=editBook(id),b=item(id);if(s.celebrated||s.status!=='read'||b.type!=='book')return;s.celebrated=true;save();const c=data.reading.completion;document.getElementById('completion-title').textContent=c.title;document.getElementById('completion-text').textContent=c.text;document.getElementById('completion-book').textContent='«'+b.title+'»';document.getElementById('completion-close').textContent=c.button;const dialog=document.getElementById('completion');if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');}
function savedButton(b){return '<button class="btn '+(bookState(b.id).saved?'outline':'')+'" data-save="'+esc(b.id)+'" aria-pressed="'+!!bookState(b.id).saved+'">'+(bookState(b.id).saved?'✓ В отложенных':'＋ '+esc(data.app.primaryAction))+'</button>';}
function card(b){return '<article class="card"><button class="card-open" data-book="'+esc(b.id)+'">'+image(b)+'<h3>'+esc(b.title)+'</h3></button><p class="creator">'+esc(b.creator)+'</p>'+savedButton(b)+'</article>';}
function grid(books){return books.length?'<div class="cards">'+books.map(card).join('')+'</div>':'<div class="empty"><h3>Здесь пока нет материалов</h3><p class="muted">Подборка появится после добавления рекомендаций Анны.</p><button class="smalllink" data-view="home">Вернуться к рубрикам →</button></div>';}
function header(){return '<header class="top"><span>Анна Павлинчук</span><span class="star">✦</span><span>Книги и смыслы</span></header>';}
function back(){return '<button class="back" data-back>← Назад</button>';}
function daily(){return state.daily[dateKey()]||{goal:data.reading.defaultDailyMinutes,bookId:'',comment:''};}
function todayMinutes(){return state.sessions.filter(s=>s.date===dateKey()).reduce((n,s)=>n+s.minutes,0);}
function progress(n,max){if(!max)return '';return '<div class="progress" role="progressbar" aria-valuenow="'+Math.min(n,max)+'" aria-valuemin="0" aria-valuemax="'+max+'"><i style="width:'+Math.min(100,Math.max(0,n/max*100))+'%"></i></div>';}
function home(){const b=item(data.app.featuredId)||data.items[0],count=Object.values(state.books).filter(b=>b.saved).length;return header()+'<section class="hero"><div class="eyebrow">Твоя следующая книга</div><h1>Книжная<br>полка</h1><p class="tagline">'+esc(data.app.subtitle)+'</p>'+(data.app.demo?'<span class="badge">Демонстрационная подборка · книги вымышлены</span>':'')+'</section>'+(b?'<section><div class="heading"><h2>Книга в фокусе</h2><span class="star">✦</span></div><article class="feature"><button class="card-open" data-book="'+b.id+'">'+image(b)+'</button><div><span class="eyebrow">Знакомство с книгой</span><button class="card-open" data-book="'+b.id+'"><h3>'+esc(b.title)+'</h3></button><p class="creator">'+esc(b.creator)+'</p>'+savedButton(b)+'</div></article></section>':'')+'<section class="section"><div class="heading"><h2>Выбери тему</h2><span class="muted">09 рубрик</span></div><div class="rubrics">'+data.categories.map(c=>'<button class="rubric" data-category="'+c.id+'"><span>✦</span><span>'+esc(c.title)+'</span><span class="arrow">↗</span></button>').join('')+'</div></section><section class="section"><div class="heading"><h2>Новые рекомендации</h2><button class="smalllink" data-category="all">Все материалы →</button></div>'+grid(data.app.newIds.map(item).filter(Boolean))+'</section><section class="section panel"><h2>Моя полка</h2><div class="stats"><div class="stat"><b>'+count+'</b><span>отложено</span></div><div class="stat"><b>'+Object.values(state.books).filter(b=>b.status==='reading').length+'</b><span>читаю</span></div><div class="stat"><b>'+Object.values(state.books).filter(b=>b.status==='read').length+'</b><span>прочитано</span></div></div><button class="btn outline full" data-view="shelf">Открыть мою полку →</button></section><section class="section panel"><h2>Чтение сегодня</h2><p class="muted" style="margin-top:12px">'+todayMinutes()+' из '+daily().goal+' минут</p>'+progress(todayMinutes(),daily().goal)+'<button class="btn full" data-view="today">Запланировать чтение</button></section><section class="section"><a class="btn full" href="'+safeURL(data.author.groupUrl)+'" target="_blank" rel="noopener">'+esc(data.app.communityButton)+' ↗</a><p class="muted" style="margin-top:12px">'+esc(data.app.communityText)+'</p></section>'+(data.app.demo?'<p class="notice">'+esc(data.app.demoNotice)+'</p>':'');}
function catalogue(){const c=data.categories.find(c=>c.id===category),books=category==='all'?data.items:data.items.filter(b=>b.categories.includes(category));return header()+back()+'<h2>'+esc(c?.title||'Все материалы')+'</h2><p class="muted" style="margin-top:10px">'+books.length+' материалов в подборке</p><input class="search" id="search" type="search" aria-label="Поиск по названию или автору" placeholder="Название или автор" value="'+esc(query)+'"><div id="results">'+grid(searchBooks(books))+'</div>';}
function searchBooks(books){const q=query.toLocaleLowerCase('ru');return books.filter(b=>(b.title+' '+b.creator).toLocaleLowerCase('ru').includes(q));}
function shelf(){const books=data.items.filter(b=>filter==='saved'?bookState(b.id).saved:bookState(b.id).status===filter);return header()+'<section class="hero"><div class="eyebrow">Твоё пространство чтения</div><h1>Моя полка</h1></section><div class="chips">'+data.reading.statuses.map(s=>'<button class="chip '+(filter===s.id?'active':'')+'" data-filter="'+s.id+'">'+esc(s.title)+'</button>').join('')+'</div>'+(books.length?grid(books):'<div class="empty"><h3>Здесь будут твои книги</h3><p class="muted">Выбери книгу в каталоге и нажми «Отложить». Статус чтения меняется в карточке.</p><button class="smalllink" data-view="home">Выбрать книгу →</button></div>');}
function detail(){
const b=item(selected),s=bookState(selected),total=bookTotal(b),isBook=b.type==='book',unit=isBook?'страниц':'минут';
const citations=b.quotesText?'<p class="muted" style="margin-top:12px">Цитаты и заметки сохранены из публикации Анны.</p><div class="source-quotes" style="margin-top:18px">'+esc(b.quotesText)+'</div>':b.quotes.length?b.quotes.map(q=>'<blockquote class="quote">'+esc(q)+'</blockquote>').join(''):'<p class="muted" style="margin-top:14px">В этой публикации цитаты не приведены.</p>';
return header()+back()+'<div class="book-head">'+image(b)+'<div><span class="eyebrow">'+(isBook?'Книга':'Видеолекция')+'</span><h1>'+esc(b.title)+'</h1><p class="creator">'+esc(b.creator)+'</p>'+(total?'<span class="muted">'+total+' '+unit+'</span>':'')+'</div></div>'+savedButton(b)+'<div class="chips">'+b.categories.map(id=>'<button class="chip" data-category="'+id+'">'+esc(data.categories.find(c=>c.id===id)?.title)+'</button>').join('')+'</div><h2 class="subheading">'+(isBook?'О книге':'О лекции')+'</h2><div class="book-description">'+esc(b.description)+'</div>'+((b.gallery||[]).length?'<div class="book-gallery">'+b.gallery.map(src=>'<img loading="lazy" src="'+esc(src)+'" alt="Фотография из публикации о '+esc(b.title)+'">').join('')+'</div>':'')+'<div class="divider"></div><h2>Цитаты</h2>'+citations+(b.links||[]).map((url,i)=>'<a class="btn outline full" style="margin-top:16px" href="'+safeURL(url)+'" target="_blank" rel="noopener">'+(isBook?'Ссылка из публикации':'Открыть лекцию')+((b.links||[]).length>1?' '+(i+1):'')+' ↗</a>').join('')+'<div class="divider"></div><h2>Моё чтение</h2><label for="status">Статус</label><select id="status"><option value="" '+(!s.status?'selected':'')+'>Ещё не читаю</option><option value="reading" '+(s.status==='reading'?'selected':'')+'>Читаю</option><option value="read" '+(s.status==='read'?'selected':'')+'>'+ (isBook?'Прочитано':'Просмотрено')+'</option></select><label for="edition-total">'+(isBook?'Количество страниц в моём издании':'Длительность лекции, минут')+'</label><div class="row"><input id="edition-total" type="number" min="1" max="100000" step="1" placeholder="Укажи свой объём" value="'+(total||'')+'" style="flex:1"><button class="btn outline" id="save-total">Сохранить</button></div>'+(total?'<label for="position">Прогресс: '+unit+' из '+total+'</label><div class="row"><input id="position" type="number" min="0" max="'+total+'" step="1" value="'+(s.position||0)+'" style="flex:1"><button class="btn outline" id="save-position">Сохранить</button></div>'+progress(s.position||0,total):'<p class="muted" style="margin:15px 0">Укажи объём, чтобы отслеживать прогресс. Статус, заметки и таймер доступны уже сейчас.</p>')+'<button class="btn full" id="plan-book" style="margin-top:16px">Запланировать на сегодня</button><div class="divider"></div><h2>Мои заметки</h2><label for="note">Мысли и вопросы</label><textarea id="note" placeholder="Что хочется запомнить? О чём подумать?">'+esc(s.note)+'</textarea><button class="btn outline full" id="save-note" style="margin-top:12px">Сохранить заметку</button>';
}
function safeURL(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#';}catch{return '#';}}
function today(){const d=daily(),m=todayMinutes(),t=state.timer,books=data.items.filter(b=>bookState(b.id).saved);return header()+'<section class="hero"><div class="eyebrow">Время для книги</div><h1>Чтение<br>сегодня</h1></section><section class="panel"><h2>Мой план</h2><label for="plan-item">Выбрать из отложенных</label><select id="plan-item"><option value="">Выбери материал</option>'+books.map(b=>'<option value="'+b.id+'" '+(d.bookId===b.id?'selected':'')+'>'+esc(b.title)+'</option>').join('')+'</select>'+(!books.length?'<p class="muted" style="margin-top:12px">Пока нет отложенных книг. Выбери книгу в каталоге и нажми «Отложить».</p><button class="smalllink" data-category="all">Выбрать книгу →</button>':'')+'<label for="goal">Сколько минут сегодня?</label><input id="goal" type="number" min="1" max="1440" value="'+d.goal+'"><div class="chips">'+data.reading.minuteOptions.map(n=>'<button class="chip" data-minutes="'+n+'">'+n+' мин</button>').join('')+'</div><button class="btn full" id="save-plan">Сохранить план</button></section><section class="section panel"><h2>Прогресс дня</h2><p class="muted" style="margin-top:12px">'+m+' из '+d.goal+' минут'+(m>=d.goal?' · План выполнен ✓':'')+'</p>'+progress(m,d.goal)+'<div class="timer" id="clock">00:00</div><p class="muted" style="text-align:center">'+(t?'Таймер: '+esc(item(t.bookId)?.title||'Книга'):'Таймер учитывает время, пока ты читаешь')+'</p><div class="row" style="margin-top:17px"><button class="btn" id="timer-toggle">'+(t?.startedAt?'Пауза':t?'Продолжить':'Начать чтение')+'</button><button class="btn outline" id="timer-finish" '+(!t?'disabled':'')+'>Завершить</button></div><label for="session-comment">Что читала, какие мысли появились?</label><textarea id="session-comment" placeholder="Комментарий к сегодняшнему чтению">'+esc(t?.comment||d.comment||'')+'</textarea><label for="manual-minutes">Добавить время вручную, минут</label><div class="row"><input id="manual-minutes" type="number" min="1" max="1440" value="20" style="flex:1"><button class="btn outline" id="manual-log">Записать</button></div></section><section class="history"><h2>История чтения</h2>'+(state.sessions.length?state.sessions.slice().reverse().map(s=>'<article class="log"><strong>'+esc(item(s.bookId)?.title||'Материал удалён')+'</strong><small>'+esc(s.date)+' · '+s.minutes+' мин</small>'+(s.comment?'<p>'+esc(s.comment)+'</p>':'')+'</article>').join(''):'<p class="muted" style="margin-top:15px">Здесь появятся завершённые сеансы чтения и твои комментарии.</p>')+'</section>';}
function author(){const a=data.author,join='<a class="btn full" href="'+safeURL(a.groupUrl)+'" target="_blank" rel="noopener">'+esc(a.groupButton)+' ↗</a>';return header()+'<section class="hero"><div class="eyebrow">Об авторе книжной полки</div><h1>Анна<br>Павлинчук</h1></section><img class="author-photo" src="'+esc(a.photo)+'" alt="Анна Павлинчук с книгами у книжной полки">'+'<div class="author-copy">'+a.description.split(/\n\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+join;}
function render(){app.innerHTML=({home,shelf,today,author,catalogue,detail}[view]||home)();nav.hidden=false;nav.innerHTML=[['home','⌂','Главная'],['shelf','▤','Моя полка'],['today','◷','Чтение'],['author','✦','Автор']].map(([v,i,t])=>'<button data-view="'+v+'" class="'+(view===v?'active':'')+'" '+(view===v?'aria-current="page"':'')+'><span aria-hidden="true">'+i+'</span>'+t+'</button>').join('');if(!storageOK)app.insertAdjacentHTML('afterbegin','<p class="notice">Сохранение на устройстве недоступно: изменения хранятся до закрытия приложения.</p>');updateClock();}
let previous='home';
function go(v){if(view==='today')keepComment();view=v;render();window.scrollTo(0,0);}
function keepComment(){const el=document.getElementById('session-comment');if(el){state.daily[dateKey()]=Object.assign(daily(),{comment:el.value});if(state.timer)state.timer.comment=el.value;save();}}
function seconds(){const t=state.timer;return t?Math.max(0,(t.elapsed||0)+(t.startedAt?(Date.now()-t.startedAt)/1000:0)):0;}
function updateClock(){const el=document.getElementById('clock');if(el){const n=Math.floor(seconds());el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}}
function validMinutes(value){const n=Number(value);return Number.isInteger(n)&&n>=1&&n<=1440?n:null;}
function logSession(bookId,minutes,comment){state.sessions.push({id:Date.now().toString(),date:dateKey(),bookId,minutes,comment});const b=editBook(bookId);if(b.status!=='read')b.status='reading';b.saved=true;}
function selectedPlan(){const select=document.getElementById('plan-item');return select?select.value:daily().bookId;}
function acceptData(d){if(!d.app||!Array.isArray(d.items)||!Array.isArray(d.categories)||!d.author||!d.reading)throw Error('schema');const ids=new Set(d.items.map(b=>b.id));if(ids.size!==d.items.length||d.items.some(b=>!b.id||!b.title||!Array.isArray(b.categories)||!Array.isArray(b.quotes)||[b.pages,b.durationMinutes].some(n=>n!=null&&(!Number.isFinite(n)||n<=0))))throw Error('items');data=d;state.books=Object.fromEntries(Object.entries(state.books).filter(([id])=>ids.has(id)));state.sessions=state.sessions.filter(s=>ids.has(s.bookId));for(const day of Object.values(state.daily)){if(day.bookId&&!ids.has(day.bookId))day.bookId='';}if(state.timer&&!ids.has(state.timer.bookId))state.timer=null;save();view='home';render();}
async function load(){nav.hidden=true;try{const res=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP');acceptData(await res.json());}catch(e){app.innerHTML='<section class="loading"><span class="star">✦</span><h2 style="margin:20px 0">Откроем твою полку</h2><p class="muted">Не удалось автоматически загрузить подборку. Если ты открыла HTML как файл, выбери скачанный data.json вручную.</p><button class="btn full" id="import-data" style="margin-top:22px">Выбрать data.json</button><input id="data-file" type="file" accept=".json,application/json" hidden><button class="btn outline full" id="retry" style="margin-top:12px">Повторить загрузку</button><p class="muted" style="margin-top:16px">Для автоматического открытия в Telegram оба файла должны находиться рядом на HTTPS-сервере.</p></section>';}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='completion-close'){const dialog=document.getElementById('completion');if(dialog.close)dialog.close();else dialog.removeAttribute('open');return;}if(b.id==='retry'){load();return;}if(b.id==='import-data'){document.getElementById('data-file').click();return;}if(!data)return;if(b.dataset.view){go(b.dataset.view);return;}if(b.hasAttribute('data-back')){go(previous);return;}if(b.dataset.category){category=b.dataset.category;query='';previous='home';go('catalogue');return;}if(b.dataset.book){selected=b.dataset.book;previous=view;go('detail');return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.save){const id=b.dataset.save,s=editBook(id);s.saved=!s.saved;save();const y=window.scrollY;render();window.scrollTo(0,y);toast(s.saved?'Книга добавлена в отложенные':'Книга убрана из отложенных');return;}if(b.dataset.minutes){document.getElementById('goal').value=b.dataset.minutes;return;}
if(b.id==='save-note'){editBook(selected).note=document.getElementById('note').value;save();toast('Заметка сохранена');}
if(b.id==='save-total'){const n=Number(document.getElementById('edition-total').value);if(!Number.isInteger(n)||n<1||n>100000){toast('Укажи целое число от 1 до 100000');return;}const s=editBook(selected);s.total=n;s.position=s.status==='read'?n:Math.min(s.position||0,n);save();render();toast('Объём сохранён');}
if(b.id==='save-position'){const book=item(selected),max=bookTotal(book),n=Number(document.getElementById('position').value);if(!Number.isInteger(n)||n<0||n>max){toast('Укажи целое число от 0 до '+max);return;}const s=editBook(selected);s.position=n;s.saved=true;s.status=n===max?'read':n>0?'reading':s.status;save();render();toast('Прогресс сохранён');celebrate(selected);}
if(b.id==='plan-book'){state.daily[dateKey()]=Object.assign(daily(),{bookId:selected});const s=editBook(selected);s.saved=true;if(s.status!=='read')s.status='reading';save();go('today');}
if(b.id==='save-plan'){const goal=validMinutes(document.getElementById('goal').value),bookId=selectedPlan();if(!goal||!bookId){toast('Выбери книгу и время от 1 до 1440 минут');return;}keepComment();state.daily[dateKey()]=Object.assign(daily(),{goal,bookId});save();render();toast('План на сегодня сохранён');}
if(b.id==='timer-toggle'){keepComment();if(state.timer){const t=state.timer;if(t.startedAt){t.elapsed=seconds();t.startedAt=null;}else t.startedAt=Date.now();}else{const bookId=selectedPlan();if(!bookId){toast('Сначала выбери книгу');return;}state.daily[dateKey()]=Object.assign(daily(),{bookId});state.timer={bookId,startedAt:Date.now(),elapsed:0,comment:daily().comment||''};}save();render();}
if(b.id==='timer-finish'){keepComment();const t=state.timer;if(!t)return;const n=seconds();if(n<60){toast('Пока прошло меньше минуты. Продолжи чтение, чтобы записать сеанс.');return;}logSession(t.bookId,Math.floor(n/60),t.comment||'');state.timer=null;save();render();toast('Чтение записано в историю');}
if(b.id==='manual-log'){const bookId=selectedPlan(),minutes=validMinutes(document.getElementById('manual-minutes').value);if(!bookId||!minutes){toast('Выбери книгу и время от 1 до 1440 минут');return;}keepComment();logSession(bookId,minutes,document.getElementById('session-comment').value);save();render();toast('Время чтения записано');}
});
document.addEventListener('change',async e=>{if(e.target.id==='data-file'){const file=e.target.files?.[0];if(!file)return;try{acceptData(JSON.parse(await file.text()));toast('Подборка загружена');}catch(err){toast('Этот файл не подходит. Выбери data.json из комплекта прототипа.');}return;}if(e.target.id==='status'){const s=editBook(selected);s.status=e.target.value;if(s.status)s.saved=true;if(s.status==='read')s.position=bookTotal(item(selected));save();render();toast('Статус сохранён');celebrate(selected);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('results').innerHTML=grid(searchBooks(category==='all'?data.items:data.items.filter(b=>b.categories.includes(category))));}if(e.target.id==='note'){editBook(selected).note=e.target.value;save();}if(e.target.id==='session-comment'){keepComment();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(view==='today')keepComment();save();}});
setInterval(updateClock,1000);
load();
</script>
</body>
</html>
